    <polygon points="6.3,12.6 8.3,12.6 9.0,23.0 5.6,23.0"/>
    <g transform="rotate(20 7.4 7.0)">
      <rect x="2.25" y="1.85" width="2.9" height="2.9" rx="0.7"/>
      <rect x="5.95" y="1.85" width="2.9" height="2.9" rx="0.7"/>
      <rect x="9.65" y="1.85" width="2.9" height="2.9" rx="0.7"/>
      <rect x="2.25" y="5.55" width="2.9" height="2.9" rx="0.7"/>
      <rect x="5.95" y="5.55" width="2.9" height="2.9" rx="0.7"/>
      <rect x="9.65" y="5.55" width="2.9" height="2.9" rx="0.7"/>
      <rect x="2.25" y="9.25" width="2.9" height="2.9" rx="0.7"/>
